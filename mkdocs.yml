site_name: Story Forge
site_description: >-
  Story Forge is a local AI video pipeline for Apple Silicon Macs. Write a .sf
  script and it makes the stills, motion, voices and music and cuts the film,
  with no cloud service.
site_url: https://nicedreamzapp.github.io/story-forge/
repo_url: https://github.com/nicedreamzapp/story-forge
repo_name: nicedreamzapp/story-forge
edit_uri: edit/main/docs/
copyright: Code MIT. Films see LICENSE-ASSETS.md in the repo.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - social
  # The sitemap is written by MkDocs itself (sitemap.xml) whenever site_url is set.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Credits: credits.md
